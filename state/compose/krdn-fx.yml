# KRDN-FX Docker Compose
# 192.168.0.5 운영 서버 배포용
# 포트: Dashboard=3015, Backend=8010, DB=기존 krdn-timescaledb(5435) 사용

services:
  # FastAPI Backend
  # 기존 krdn-timescaledb (포트 5435)를 사용
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: krdn-fx-backend
    restart: unless-stopped
    environment:
      # Database - host.docker.internal로 호스트의 krdn-timescaledb 접근
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5435}
      DB_NAME: ${DB_NAME:-krdn_fx}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # API Keys
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      API_KEY: ${API_KEY:-}
    ports:
      - "8010:8000"
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Next.js Dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://fx.krdn.kr}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://fx.krdn.kr}
    container_name: krdn-fx-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://fx.krdn.kr}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://fx.krdn.kr}
      NEXT_PUBLIC_API_KEY: ${API_KEY:-}
    ports:
      - "3015:3000"
