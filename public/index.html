<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1" />
    <title>gons-works — 운영자 콘솔</title>
    <!--
      STACK.md 버전 lock: htmx@2.0.10, htmx-ext-sse@2.2.4
      DESIGN.md correction #4: htmx 2.x core에서 SSE 제거됨 → htmx-ext-sse 별도 로드 필수.
      Phase 1은 로컬 정적 파일 서빙(server.ts /static/ route — 오프라인 가능).
    -->
    <script src="/static/htmx.min.js"></script>
    <script src="/static/sse.js"></script>
    <style>
      :root {
        /* Colors — 다크 터미널 (UI-SPEC.md Color 섹션) */
        --color-bg: #0f1117;
        --color-surface: #1a1d27;
        --color-accent: #4ade80;
        --color-error: #ef4444;
        --color-text: #e2e8f0;
        --color-muted: #64748b;
        --color-mono: #86efac;
        --color-border: #2d3244;
        --color-warning: #f59e0b;
        --color-error-bg: rgba(239, 68, 68, 0.1);
        --color-mono-on-error: #fca5a5;
        --color-mono-bg-on-error: rgba(0, 0, 0, 0.3);

        /* Spacing (UI-SPEC.md Spacing Scale) */
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;

        /* Typography (UI-SPEC.md Typography) */
        --font-size-label: 13px;
        --font-size-body: 15px;
        --font-size-mono: 13px;
        --font-size-heading: 17px;
        --font-weight-normal: 400;
        --font-weight-semibold: 600;
        --line-height-body: 1.6;
        --line-height-label: 1.4;
        --line-height-mono: 1.5;
        --font-family-sans: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --font-family-mono: 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-family-sans);
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: var(--space-md) var(--space-xl);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
      }

      /* ===== #drift-banner — KB-03 / D-13.4 / UI-04 ===== */
      #drift-banner {
        display: none;
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--color-surface);
        border: 2px solid var(--color-warning);
        border-radius: 4px;
        padding: var(--space-md);
        margin-bottom: var(--space-lg);
        font-size: var(--font-size-heading);
        font-weight: var(--font-weight-semibold);
        line-height: 1.3;
      }
      #drift-banner .body {
        margin-top: var(--space-xs);
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-normal);
        color: var(--color-text);
      }

      /* ===== #error-banner — D-15.2 ===== */
      #error-banner {
        display: none;
        position: sticky;
        top: 0;
        z-index: 99;
        background: var(--color-error-bg);
        border: 1px solid var(--color-error);
        border-radius: 4px;
        padding: var(--space-md);
      }
      #error-banner .heading {
        font-weight: var(--font-weight-semibold);
        font-size: var(--font-size-heading);
        line-height: 1.3;
        color: var(--color-text);
      }
      #error-banner .cause {
        margin-top: var(--space-xs);
        font-size: var(--font-size-body);
        color: var(--color-text);
      }
      #error-banner .fix-label {
        margin-top: var(--space-md);
        font-size: var(--font-size-label);
        font-weight: var(--font-weight-semibold);
        color: var(--color-muted);
        line-height: var(--line-height-label);
      }
      /* D-15.1: fix 필드 verbatim — monospace 표시. raw HTML 파싱 비-사용 (textContent로만). */
      #error-banner .fix {
        margin-top: var(--space-xs);
        padding: var(--space-sm) var(--space-md);
        background: var(--color-mono-bg-on-error);
        color: var(--color-mono-on-error);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-mono);
        line-height: var(--line-height-mono);
        white-space: pre-wrap;
        border-radius: 4px;
      }

      /* ===== #output — LLM text-delta 누적 영역 ===== */
      #output {
        flex-grow: 1;
        min-height: 200px;
        padding: var(--space-md);
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        white-space: pre-wrap;
        overflow-y: auto;
        line-height: var(--line-height-body);
        color: var(--color-text);
      }
      #output:empty::before {
        content: "운영자 질문을 입력하면 서비스 상태와 로그를 분석합니다.";
        color: var(--color-muted);
        font-style: italic;
      }

      /* ===== .tool-event — UI-03 tool 호출 시각화 ===== */
      .tool-event {
        display: block;
        background: var(--color-surface);
        border-left: 3px solid var(--color-accent);
        padding: var(--space-sm) var(--space-md);
        margin: var(--space-sm) 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-label);
        line-height: var(--line-height-label);
        color: var(--color-text);
        border-radius: 2px;
      }
      .tool-event.error {
        border-left-color: var(--color-error);
      }

      /* ===== #status-bar — final 표시 ===== */
      #status-bar {
        color: var(--color-accent);
        font-size: var(--font-size-label);
        line-height: var(--line-height-label);
        min-height: 1.5em;
        font-weight: var(--font-weight-semibold);
        transition: opacity 400ms ease-out;
      }
      #status-bar.fade { opacity: 0; }

      /* ===== form ===== */
      form {
        display: flex;
        gap: var(--space-sm);
        align-items: stretch;
      }
      input#prompt {
        flex-grow: 1;
        padding: var(--space-sm) var(--space-md);
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        color: var(--color-text);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
      }
      input#prompt:focus {
        border-color: var(--color-accent);
        outline: none;
      }
      button[type="submit"] {
        padding: var(--space-sm) var(--space-lg);
        background: transparent;
        border: 1px solid var(--color-accent);
        color: var(--color-accent);
        font-family: var(--font-family-sans);
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-semibold);
        border-radius: 4px;
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }
      button[type="submit"]:hover {
        background: var(--color-accent);
        color: var(--color-bg);
      }
      button[type="submit"]:focus {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

      /* ===== Phase 2: 5-key approval form (DESIGN.md correction #5 lock) ===== */
      .approval-card {
        border: 1px solid var(--color-warning);
        border-left: 4px solid var(--color-warning);
        background: var(--color-surface);
        padding: var(--space-md);
        margin: var(--space-md) 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-mono);
        line-height: var(--line-height-mono);
        border-radius: 4px;
      }
      .approval-card:focus {
        outline: 2px solid var(--color-warning);
        outline-offset: 2px;
      }
      /* 인라인 legend — DESIGN.md correction #5: 항상 visible (custom UX) */
      .approval-card .legend {
        font-size: var(--font-size-label);
        color: var(--color-muted);
        line-height: var(--line-height-label);
        margin-bottom: var(--space-sm);
      }
      .approval-card .legend kbd {
        background: var(--color-bg);
        color: var(--color-text);
        padding: 2px 6px;
        border-radius: 3px;
        border: 1px solid var(--color-border);
        margin: 0 2px;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-label);
      }
      .approval-card .header {
        font-weight: var(--font-weight-semibold);
        font-size: var(--font-size-heading);
        line-height: 1.3;
        color: var(--color-text);
        margin-bottom: var(--space-sm);
      }
      .approval-card .reasoning {
        background: var(--color-bg);
        padding: var(--space-sm) var(--space-md);
        margin: var(--space-sm) 0;
        border-left: 2px solid var(--color-mono);
        color: var(--color-text);
        white-space: pre-wrap;
        border-radius: 2px;
      }
      .approval-card pre.diff {
        max-height: 400px;
        overflow: auto;
        background: var(--color-bg);
        padding: var(--space-sm);
        margin: var(--space-sm) 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-mono);
        line-height: var(--line-height-mono);
        color: var(--color-mono);
        border-radius: 2px;
        white-space: pre-wrap;
      }
      .approval-card pre.diff.hidden { display: none; }
      .approval-card textarea.edit {
        display: none;
        width: 100%;
        min-height: 200px;
        background: var(--color-bg);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        padding: var(--space-sm);
        margin-top: var(--space-sm);
        font-family: var(--font-family-mono);
        font-size: var(--font-size-mono);
        line-height: var(--line-height-mono);
      }
      .approval-card textarea.edit.visible { display: block; }
      .approval-card textarea.edit:focus {
        outline: none;
        border-color: var(--color-accent);
      }
      .approval-card .actions {
        margin-top: var(--space-sm);
        font-size: var(--font-size-label);
        color: var(--color-muted);
        line-height: var(--line-height-label);
      }
      .approval-card.submitted {
        opacity: 0.7;
      }
      .approval-card .submitted-status {
        margin-top: var(--space-sm);
        font-size: var(--font-size-label);
        color: var(--color-accent);
      }
      .approval-card .submit-error {
        margin-top: var(--space-sm);
        font-size: var(--font-size-label);
        color: var(--color-error);
      }

      /* applied 카드 — 성공 (Phase 1 tool-result ✓ 패턴 차용) */
      .applied-card {
        display: block;
        background: var(--color-surface);
        border-left: 4px solid var(--color-accent);
        padding: var(--space-sm) var(--space-md);
        margin: var(--space-sm) 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-label);
        line-height: var(--line-height-label);
        color: var(--color-text);
        border-radius: 2px;
      }

      /* rolled-back 카드 — 실패/롤백 (Phase 1 tool-result ✗ 패턴 차용) */
      .rolled-back-card {
        display: block;
        background: var(--color-surface);
        border-left: 4px solid var(--color-error);
        padding: var(--space-sm) var(--space-md);
        margin: var(--space-sm) 0;
        font-family: var(--font-family-mono);
        font-size: var(--font-size-label);
        line-height: var(--line-height-label);
        color: var(--color-text);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- UI-04 / D-13.4: drift 이벤트 수신 시 display:block — services.yaml 불일치 경고 -->
      <div id="drift-banner" role="status" aria-live="polite"></div>

      <!-- D-15.2: error 이벤트 수신 시 display:block — 빨간 배너, fix 필드 verbatim -->
      <div id="error-banner" role="alert" aria-live="assertive"></div>

      <!-- LLM text-delta + tool-start/tool-result 카드 누적 영역 -->
      <div id="output"></div>

      <!-- final 이벤트: "✓ 완료" 표시 후 1.5s fade -->
      <div id="status-bar" aria-live="polite"></div>

      <!--
        POST /chat → 응답 fragment(sse-connect div)가 #sse-mount로 swap.
        htmx-ext-sse가 그 div를 process하여 GET /chat-stream에 EventSource 연결 (PITFALL #4 자동 재연결 — Plan 06 inFlight Map dedup으로 server-side 보호).
      -->
      <form hx-post="/chat" hx-target="#sse-mount" hx-swap="innerHTML">
        <input
          id="prompt"
          name="prompt"
          type="text"
          autofocus
          autocomplete="off"
          placeholder="질문하세요. 예: ais-prod redis 어디 쓰여?"
        />
        <button type="submit">전송</button>
      </form>

      <!-- SSE 채널 마운트 지점. POST /chat 응답이 swap되면 sse-connect div가 여기로 들어와 EventSource 시작. -->
      <div id="sse-mount" style="display: none" aria-hidden="true"></div>
    </main>

    <script>
      // 보안 원칙: 모든 외부 데이터(LLM 응답, tool args, error fix, drift list)는
      // textContent / createTextNode / createElement만 사용해 DOM 추가.
      // raw HTML 파싱(문자열 → DOM)은 사용하지 않음 (T-01-08-01/02 차단, FRICTION #9 lesson).
      (function () {
        var outputEl = document.getElementById("output");
        var driftEl = document.getElementById("drift-banner");
        var errorEl = document.getElementById("error-banner");
        var statusEl = document.getElementById("status-bar");
        var formEl = document.querySelector("form");

        // tool-start ↔ tool-result 페어링: tool name → 카드 element 매핑.
        // CSS attribute selector 이스케이프 우회 + O(1) 조회.
        var toolCards = new Map();

        // 새 prompt submit 직전 이전 출력 reset (UI-SPEC.md Interaction Contract).
        document.body.addEventListener("htmx:beforeRequest", function (evt) {
          if (evt.detail && evt.detail.elt === formEl) {
            outputEl.replaceChildren();
            errorEl.style.display = "none";
            errorEl.replaceChildren();
            // drift 배너는 운영자 인지 + 조치 의무 — 새 prompt에서도 유지.
            statusEl.replaceChildren();
            statusEl.classList.remove("fade");
            toolCards.clear();
          }
        });

        // SSE message dispatch: 6 이벤트 분기 (UI-02).
        document.body.addEventListener("htmx:sseMessage", function (evt) {
          var detail = evt.detail;
          if (!detail || typeof detail.data !== "string") return;

          var parsed;
          try {
            parsed = JSON.parse(detail.data);
          } catch (e) {
            // JSON parse 실패는 무시 (다른 SSE 메시지일 수 있음).
            return;
          }

          switch (detail.type) {
            case "text-delta": {
              var delta = String(parsed.delta || "");
              outputEl.appendChild(document.createTextNode(delta));
              break;
            }

            case "tool-start": {
              var name = String(parsed.name || "(unknown)");
              var card = document.createElement("div");
              card.className = "tool-event";
              card.dataset.toolName = name;
              card.textContent = "· " + name + " 호출 중...";
              outputEl.appendChild(card);
              toolCards.set(name, card);
              break;
            }

            case "tool-result": {
              var rname = String(parsed.name || "(unknown)");
              var rcard = toolCards.get(rname);
              if (!rcard) {
                // 페어링 누락 — 새 카드를 만들어 결과만 표시 (방어적).
                rcard = document.createElement("div");
                rcard.className = "tool-event";
                rcard.dataset.toolName = rname;
                outputEl.appendChild(rcard);
              }
              var ok = parsed.ok === true;
              rcard.classList.toggle("error", !ok);
              var summary = String(parsed.summary || (ok ? "" : "오류"));
              rcard.textContent = (ok ? "✓ " : "✗ ") + rname + " — " + summary;
              toolCards.delete(rname);
              break;
            }

            case "final": {
              statusEl.replaceChildren();
              statusEl.classList.remove("fade");
              statusEl.textContent = "✓ 완료";
              setTimeout(function () {
                statusEl.classList.add("fade");
              }, 1500);
              break;
            }

            case "error": {
              errorEl.replaceChildren();
              var heading = document.createElement("div");
              heading.className = "heading";
              heading.textContent = String(parsed.problem || "서버 처리 실패");
              errorEl.appendChild(heading);

              var cause = document.createElement("div");
              cause.className = "cause";
              cause.textContent = "원인: " + String(parsed.cause || "(상세 정보 없음)");
              errorEl.appendChild(cause);

              var fixLabel = document.createElement("div");
              fixLabel.className = "fix-label";
              fixLabel.textContent = "해결 방법:";
              errorEl.appendChild(fixLabel);

              // D-15.1: fix 필드 verbatim — textContent로만 (영어 셸 명령 그대로 표시).
              var fix = document.createElement("div");
              fix.className = "fix";
              fix.textContent = String(parsed.fix || "");
              errorEl.appendChild(fix);

              errorEl.style.display = "block";
              break;
            }

            case "drift": {
              driftEl.replaceChildren();
              var dheading = document.createElement("div");
              dheading.className = "heading";
              dheading.textContent = "⚠ services.yaml 불일치";
              driftEl.appendChild(dheading);

              var unknownCount = Array.isArray(parsed.unknown) ? parsed.unknown.length : 0;
              var staleCount = Array.isArray(parsed.stale) ? parsed.stale.length : 0;
              var dbody = document.createElement("div");
              dbody.className = "body";
              dbody.textContent =
                "docker-only " + unknownCount + "개, yaml-only " + staleCount +
                "개 발견 — services.yaml 갱신이 필요합니다.";
              driftEl.appendChild(dbody);

              driftEl.style.display = "block";
              break;
            }

            // ===== Phase 2: APPLY-02 5-key 승인 게이트 (UI-02 +3) =====

            case "approval-required": {
              // 외부 입력값(diff/nonce/reasoning/command/stack)은 모두 textContent로만 렌더 — XSS 차단.
              var card = document.createElement("section");
              card.className = "approval-card";
              card.dataset.nonce = String(parsed.nonce || "");
              card.dataset.stack = String(parsed.stack || "");
              card.setAttribute("tabindex", "0");
              card.setAttribute("role", "dialog");
              card.setAttribute("aria-label", "승인 게이트");

              // 인라인 legend — DESIGN.md correction #5 lock (custom UX, 항상 visible).
              // 5-key 안내를 textContent + <kbd> 노드로만 구성 (HTML 문자열 주입 0회).
              var legend = document.createElement("div");
              legend.className = "legend";
              legend.appendChild(document.createTextNode("키보드: "));
              var legendKeys = [
                "[y]es",
                "[n]o",
                "[e]dit",
                "[d]iff",
                "[a]bort",
              ];
              legendKeys.forEach(function (label, i) {
                var kbd = document.createElement("kbd");
                kbd.textContent = label;
                legend.appendChild(kbd);
                if (i < legendKeys.length - 1) {
                  legend.appendChild(document.createTextNode(" "));
                }
              });
              card.appendChild(legend);

              // header — [stack] command service (만료 시간)
              var headerLine = document.createElement("div");
              headerLine.className = "header";
              var headerText = "[" + String(parsed.stack || "?") + "] " +
                String(parsed.command || "?");
              if (parsed.service) {
                headerText += " " + String(parsed.service);
              }
              if (typeof parsed.expiresAt === "number") {
                var t;
                try { t = new Date(parsed.expiresAt).toLocaleTimeString(); }
                catch (e) { t = String(parsed.expiresAt); }
                headerText += "  (만료: " + t + ")";
              }
              headerLine.textContent = headerText;
              card.appendChild(headerLine);

              // reasoning — AI가 제시한 사유 (verbatim, textContent only).
              var reasoning = document.createElement("div");
              reasoning.className = "reasoning";
              reasoning.textContent = "AI 사유: " + String(parsed.reasoning || "(없음)");
              card.appendChild(reasoning);

              // diff — unified diff (verbatim, textContent only).
              var diffPre = document.createElement("pre");
              diffPre.className = "diff";
              diffPre.textContent = String(parsed.diff || "");
              card.appendChild(diffPre);

              // edit textarea — hidden by default. 'e' 키로 visible toggle.
              // value는 fileEdit.newContent prefill (있으면). textContent 동급(value setter는 안전).
              var textarea = document.createElement("textarea");
              textarea.className = "edit";
              textarea.setAttribute("aria-label", "편집된 newContent");
              textarea.placeholder =
                "여기에 newContent를 편집한 뒤 'y'를 다시 누르거나 카드 외부에서 'y'를 누르면 edited 결정으로 전송됩니다.";
              if (typeof parsed.newContent === "string") {
                // proposePatch 결과에 newContent가 동봉돼 있으면 prefill (DOM property setter — XSS 안전).
                textarea.value = parsed.newContent;
              }
              card.appendChild(textarea);

              // actions hint — 카드 focus 안내.
              var actions = document.createElement("div");
              actions.className = "actions";
              actions.textContent = "이 카드를 클릭(focus)한 뒤 위 키 중 하나를 누르세요.";
              card.appendChild(actions);

              outputEl.appendChild(card);
              // 즉시 focus — 사용자가 추가 클릭 없이 5-key 사용 가능.
              try { card.focus(); } catch (e) { /* noop */ }
              break;
            }

            case "applied": {
              // ✓ 적용 완료 카드 (Phase 1 tool-result ✓ 패턴 차용).
              var aCard = document.createElement("div");
              aCard.className = "applied-card";
              aCard.dataset.nonce = String(parsed.nonce || "");
              var sha = String(parsed.sha_after || "");
              var shaShort = sha.length > 8 ? sha.slice(0, 8) : sha;
              var aText = "✓ 적용 완료 — [" + String(parsed.stack || "?") + "] " +
                String(parsed.command || "?");
              if (parsed.service) {
                aText += " " + String(parsed.service);
              }
              if (shaShort) {
                aText += "  sha_after=" + shaShort;
              }
              if (typeof parsed.duration_ms === "number") {
                aText += "  duration=" + parsed.duration_ms + "ms";
              }
              aCard.textContent = aText;
              outputEl.appendChild(aCard);

              // 페어링: 같은 nonce의 approval-card에 'submitted' 표시 (이미 있다면).
              var pendingCard = outputEl.querySelector(
                '.approval-card[data-nonce="' + String(parsed.nonce || "").replace(/"/g, '\\"') + '"]'
              );
              if (pendingCard) {
                pendingCard.classList.add("submitted");
              }
              break;
            }

            case "rolled-back": {
              // ✗ 롤백 카드 (reason + 자동 역명령 결과).
              var rCard = document.createElement("div");
              rCard.className = "rolled-back-card";
              rCard.dataset.nonce = String(parsed.nonce || "");

              var rLine1 = document.createElement("div");
              rLine1.textContent = "✗ 롤백 — [" + String(parsed.stack || "?") + "]  사유: " +
                String(parsed.reason || "(상세 정보 없음)");
              rCard.appendChild(rLine1);

              if (parsed.rollback_command) {
                var rLine2 = document.createElement("div");
                var okText = parsed.rollback_ok === true ? "yes" :
                  (parsed.rollback_ok === false ? "no" : "?");
                rLine2.textContent = "  자동 역명령: " + String(parsed.rollback_command) +
                  "  (성공: " + okText + ")";
                rCard.appendChild(rLine2);
              }
              outputEl.appendChild(rCard);

              // 페어링: 같은 nonce의 approval-card에 'submitted' 표시.
              var pendingRCard = outputEl.querySelector(
                '.approval-card[data-nonce="' + String(parsed.nonce || "").replace(/"/g, '\\"') + '"]'
              );
              if (pendingRCard) {
                pendingRCard.classList.add("submitted");
              }
              break;
            }

            default:
              // 알 수 없는 이벤트는 무시 (forward-compat).
              break;
          }
        });

        // ===== Phase 2: 5-key keydown handler (form scope-aware) =====
        // window scope listener — but only acts when event.target is inside .approval-card.
        // textarea/input 안에서는 normal 텍스트 입력을 허용 (5-key 비활성).
        window.addEventListener("keydown", function (ev) {
          var card = ev.target && ev.target.closest && ev.target.closest(".approval-card");
          if (!card) return;
          // 이미 결정 전송 완료된 카드는 추가 입력 무시.
          if (card.classList.contains("submitted")) return;

          // textarea 안에서는 5-key 비활성 — 정상 텍스트 입력 우선.
          var tag = ev.target.tagName;
          if (tag === "TEXTAREA" || tag === "INPUT") return;

          var key = (ev.key || "").toLowerCase();
          var allowed = ["y", "n", "e", "d", "a"];
          if (allowed.indexOf(key) < 0) return;
          ev.preventDefault();

          var nonce = card.dataset.nonce || "";
          var ta = card.querySelector("textarea.edit");

          // 'd' = diff toggle (서버 호출 0회).
          if (key === "d") {
            var pre = card.querySelector("pre.diff");
            if (pre) pre.classList.toggle("hidden");
            return;
          }

          // 'e' = textarea show + focus (서버 호출 0회).
          if (key === "e") {
            if (ta) {
              ta.classList.add("visible");
              try { ta.focus(); } catch (e) { /* noop */ }
            }
            return;
          }

          // y / n / a = POST /approval/:nonce.
          // 'y'인데 textarea가 visible + 내용 있으면 'edit' 결정으로 격상 (Open Q 1 lock).
          var body = new URLSearchParams();
          var decisionKey = key;
          var newContent = null;
          if (key === "y" && ta && ta.classList.contains("visible") && ta.value && ta.value.length > 0) {
            decisionKey = "e";
            newContent = ta.value;
          }
          body.set("key", decisionKey);
          if (newContent !== null) {
            body.set("newContent", newContent);
          }

          fetch("/approval/" + encodeURIComponent(nonce), {
            method: "POST",
            headers: {
              "x-session-id": (window.__sessionId || "default"),
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: body,
          }).then(function (res) {
            if (!res.ok) {
              return res.json().then(function (envelope) {
                var errLine = document.createElement("div");
                errLine.className = "submit-error";
                errLine.textContent = "✗ 전송 실패: " + String(envelope.problem || ("HTTP " + res.status));
                card.appendChild(errLine);
              }).catch(function () {
                var errLine = document.createElement("div");
                errLine.className = "submit-error";
                errLine.textContent = "✗ 전송 실패: HTTP " + res.status;
                card.appendChild(errLine);
              });
            }
            // 전송 성공 — applied/rolled-back SSE event 도착 대기.
            card.classList.add("submitted");
            var status = document.createElement("div");
            status.className = "submitted-status";
            status.textContent = "✓ 결정 전송: " + decisionKey + " (서버 응답 대기...)";
            card.appendChild(status);
          }).catch(function (e) {
            var errLine = document.createElement("div");
            errLine.className = "submit-error";
            errLine.textContent = "✗ 전송 실패: " + String((e && e.message) || e);
            card.appendChild(errLine);
          });
        });
      })();
    </script>
  </body>
</html>
